name: Generate blog-posts.js

on:
  push:
    branches:
      - main
    paths:
      - 'blog-posts/**/*.js'

permissions:
  contents: write

concurrency:
  group: blog-posts-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Combine blog post files
        run: |
          echo "// Auto-generated file - do not edit" > blog-posts.js
          echo "window.blogPosts = window.blogPosts || [];" >> blog-posts.js
          for file in blog-posts/*.js; do
            node -c "$file" || { echo "::error file=$file::Syntax error, aborting"; exit 1; }
            echo "// $file" >> blog-posts.js
            cat "$file" >> blog-posts.js
            echo "" >> blog-posts.js
          done

      - name: Commit and push generated file
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add blog-posts.js
          git diff --cached --quiet && exit 0
          git commit -m "Auto-generate blog-posts.js"
          git push origin HEAD:main || { git fetch origin main && git rebase origin/main && git push origin HEAD:main; }
